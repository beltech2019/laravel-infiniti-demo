WITDRAWL_MSG_13 = "KhelPlayRummy tiene un compromiso total e inquebrantable con la seguridad de los fondos de los jugadores. Los saldos de los jugadores se guardan en cuentas segregados y no se utilizan para gastos operativos. Esto asegura que sus fondos estén siempre disponibles para que pueda cobrar de acuerdo con nuestro procedimientos bancarios y de seguridad. <br> <br>

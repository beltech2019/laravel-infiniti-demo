WITH_MSG_15 = "Le transfert est une méthode de retrait qui vous permet de recevoir vos gains / fonds en les faisant créditer directement sur votre compte bancaire. <br> <br>
Pour effectuer une demande de retrait par virement bancaire, connectez-vous à votre compte KhelPlayRummy, cliquez sur l'onglet «Retrait», puis sur Virement bancaire. Remplissez le montant que vous souhaitez retirer, s'il s'agit de votre premier retrait par virement bancaire, dans le champ suivant, vous devrez donner votre numéro de compte enregistré et remplir les coordonnées de la banque dans laquelle vous souhaitez transférer. Le numéro de compte bancaire, le type de compte, le nom de la banque, les détails de la succursale, le code IFSC et le code MIRC sont quelques-uns des détails que vous devrez soumettre pour lancer le virement bancaire. Une fois que ces détails sont soumis, ils ne peuvent pas être modifiés, remplissez les détails avec soin. <br> <br>
Dans le cas où vos coordonnées bancaires doivent être modifiées à l'avenir, la même chose peut être faite sur demande par notre équipe de support, qui vérifiera également les détails. Vous devrez appeler et soumettre les documents requis pour effectuer les changements. <br> <br>
Dans le cas où il s'agit de votre retrait régulier, nous vous demandons de lire attentivement les informations bancaires avant de remplir votre demande de retrait. Si vous constatez que le compte désigné pour recevoir votre retrait a été annulé / a des problèmes, veuillez annuler votre demande de retrait et nous envoyer un courriel à support@khelplayrummy.com Afin de vous protéger contre la collusion et la fraude, un délai de 48 heures est imposé hors de votre dernier dépôt. Par conséquent, veuillez autoriser 48 heures à partir de votre dernier dépôt avant de demander votre retrait. <br> <br>
Remarque: Les virements bancaires ne peuvent être envoyés qu'à un compte bancaire enregistré à votre nom et votre relevé bancaire doit correspondre à l'état enregistré dans votre compte KhelPlayRummy. KhelPlayRummy peut prendre jusqu'à 48 heures pour traiter votre demande de retrait et 2 jours ouvrables supplémentaires pour que les fonds soient crédités sur votre compte bancaire désigné. <br> <br>
Khelplayrummy.com n'impose pas de frais pour l'utilisation de «virement bancaire» pour le retrait de fonds deux fois par mois. Cependant, nous facturons 15,00 INR supplémentaires par transaction pour les retraits ultérieurs en un mois. Les joueurs sont responsables des frais facturés par leur banque ou banque intermédiaire (le cas échéant) pour la réception des virements bancaires. Pour plus d'informations sur la politique de votre banque concernant les frais de réception des virements bancaires, veuillez contacter directement votre banque.
* Tous nos retraits réussis sont traités sur une base quotidienne, sauf le dimanche et les jours fériés. <br> <br>
Pour toute clarification, contactez-nous au 022-25259555 ou écrivez-nous à support@khelplayrummy.com "



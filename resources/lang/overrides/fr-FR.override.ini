WITH_MSG_13 = "Vous pouvez cliquer sur le mode de virement par chèque si vous souhaitez recevoir un chèque correspondant au montant que vous souhaitez retirer de votre compte KhelPlayRummy.Le montant maximum remboursable sera affiché et vous pourrez remplir le montant à retirer. br>

WITDRAWL_MSG_13 = "KhelPlayRummy a un engagement total et inébranlable envers la sécurité et la protection des fonds des joueurs.Les soldes des joueurs sont conservés dans des comptes séparés et ne sont pas utilisés pour les dépenses opérationnelles, ce qui garantit que vos fonds sont toujours disponibles pour vous. procédures bancaires et de sécurité. <br> <br>
